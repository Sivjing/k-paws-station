<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Paws Station</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img src="logo.jpg" alt="K Paws Station Logo" width="80">

  <h1>🐱 K Paws Staion</h1>
  <p class="welcome">Welcome to our Pet Shop!</p>

<div class="product">
    <img src="cat-treat.png" alt="Cat Treat">
        
    <h2>🐱 Cat Treat</h2>
    <p>Delicious treat for cats</p>
    <h3>$2.50</h3>
    <a href="https://t.me/lysivjing" target="_blank" class="telegram-button">
    💬 Contact Us on Telegram
    </a> 
    </div>

<div class="product">
    <h2>🧶 Cat Toy</h2>
    <p>Fun toy for your cat</p>
    <h3>$3.00</h3>
    <button onclick="addToCart()">Add to Cart</button>
</div>

<div class="product">
    <h2>🥣 Cat Bowl</h2>
    <p>Food and water bowl</p>
    <h3>$4.00</h3>
    <button onclick="addToCart()">Add to Cart</button>
</div>
  
  <script src="app.js"></script>
  </body>
</body>
</html>
